{% extends 'base.html' %}
{% block title %}Hapus Produk{% endblock %}
{% block page_title %}Hapus Produk{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="form-card text-center">
            <div style="font-size:48px;margin-bottom:16px">🗑️</div>
            <h5 class="fw-bold mb-2">Hapus Produk?</h5>
            <p class="text-muted mb-4">Kamu yakin ingin menghapus produk <strong>{{ produk.nama }}</strong>? Tindakan ini tidak bisa dibatalkan.</p>
            <form method="post" class="d-flex gap-2 justify-content-center">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">
                    <i class="bi bi-trash me-1"></i> Ya, Hapus
                </button>
                <a href="{% url 'daftar_produk' %}" class="btn btn-outline-secondary px-4">Batal</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
