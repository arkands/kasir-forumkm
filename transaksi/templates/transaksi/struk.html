<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Struk #{{ transaksi.pk }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="p-4">
<div class="container" style="max-width:500px">
    <div class="text-center mb-3">
        <h4>🏪 Kasir UMKM</h4>
        <p>Struk #{{ transaksi.pk }} | {{ transaksi.tanggal|date:"d/m/Y H:i" }}</p>
        <hr>
    </div>
    <table class="table table-sm">
        {% for item in transaksi.items.all %}
        <tr>
            <td>{{ item.produk.nama }}</td>
            <td>x{{ item.jumlah }}</td>
            <td class="text-end">Rp {{ item.subtotal }}</td>
        </tr>
        {% endfor %}
        <tr class="fw-bold border-top">
            <td colspan="2">TOTAL</td>
            <td class="text-end">Rp {{ transaksi.total }}</td>
        </tr>
    </table>
    <hr>
    <p class="text-center">Terima kasih! 🙏</p>
    <div class="text-center no-print mt-3">
        <button onclick="window.print()" class="btn btn-primary">🖨️ Cetak Struk</button>
        <a href="{% url 'kasir' %}" class="btn btn-success">+ Transaksi Baru</a>
        <a href="{% url 'daftar_transaksi' %}" class="btn btn-secondary">Riwayat</a>
    </div>
</div>
</body>
</html>
